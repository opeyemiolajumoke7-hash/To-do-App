<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do APP</title>
  </head>
  <link rel="stylesheet" href="todo.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
  <body>
    <div class="modal fade" tabindex="-1" id="editModal" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Task</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="text"
              id="editInput"
              class="form-control"
              placeholder="Enter new task"
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="saveEditTask()"
            >
              Save New Task
            </button>
          </div>
        </div>
      </div>
    </div>
    <h1>To-Do-List</h1>
    <input type="text" id="userList" placeholder="Enter a task" />
    <button onclick="addTask()">+ Add Task</button>
    <div id="displayList"></div>

    
</html>
<script>
  let myTodo = [];
  let editIndex = null;
  userList = userList.trim();
  function addTask() {
    let userList = document.getElementById("userList").value;
    if (userList === "") {
      alert("Please enter a task");
    } else {
      userList = userList.trim();

      myTodo.push(userList);

      displayUpdatedArr();

      document.getElementById("userList").value = "";
    }
  }

  function DeleteList(index) {
    myTodo.splice(index, 1);

    displayUpdatedArr();
  }
  function EditList(index) {
    editIndex = index;

    document.getElementById("editInput").value = myTodo[index];

    let modal = bootstrap.Modal.getOrCreateInstance(
      document.getElementById("editModal"),
    );

    modal.show();

    displayUpdatedArr();
  }
  function saveEditTask() {
    let newValue = document.getElementById("editInput").value.trim();

    if (newValue === "") {
      alert("Please enter a task");
      return;
    }

    myTodo.splice(editIndex, 1, newValue);

    displayUpdatedArr();

    let modal = bootstrap.Modal.getOrCreateInstance(
      document.getElementById("editModal"),
    );

    modal.hide();

    document.getElementById("editInput").value = "";
    editIndex = null;
  }

  function displayUpdatedArr() {
    displayList.innerHTML = "";

    for (let index = 0; index < myTodo.length; index++) {
      displayList.innerHTML += `
        <div class="mb-2">
          <span>${myTodo[index]}</span>
          <button onclick="EditList(${index})">Edit</button>
          <button onclick="DeleteList(${index})">Delete</button>
        </div>
      `;
    }
  }

  
</script>
